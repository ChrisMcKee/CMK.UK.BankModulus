name: Merge Pull Requests into 'main'

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'src/data/**'
      - '*.props'
      - 'build/**'
      - 'global.json'

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true

jobs:
  build_and_create_a_nuget:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build version prefix/suffix
        run: |
          echo "VERSION_PREFIX=${{ github.run_number }}.0.0" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=beta.${{ github.run_attempt }}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore ./uk-bank-validator.sln --verbosity minimal

      - run: dotnet build ./uk-bank-validator.sln --configuration Release -p:ContinuousIntegrationBuild=true -p:Version=$VERSION_PREFIX-$VERSION_SUFFIX --verbosity minimal

      - name: Run tests
        run: dotnet test --project ./src/Tests/Tests.csproj --configuration Release --no-build

      - name: Pack NuGet package
        run: dotnet pack ./src/Api/Api.csproj --configuration Release --no-build --output ./artifacts -p:Version=$VERSION_PREFIX-$VERSION_SUFFIX -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

